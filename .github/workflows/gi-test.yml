name: GI Test

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner to use'
        required: true
        default: 'ubuntu-ltqa'
        type: choice
        options:
          - ubuntu-ltqa
          - ubuntu
          - ubuntu-latest
  schedule:
    - cron: '0 */2 * * *'  # Runs every 2 hours (at minute 0)
      timezone: 'Asia/Kolkata'

env:
  LT_USERNAME_STAGE: ${{ secrets.LT_USERNAME_STAGE }}
  LT_ACCESS_KEY_STAGE: ${{ secrets.LT_ACCESS_KEY_STAGE }}
  LT_APP_ID_STAGE: ${{ secrets.LT_APP_ID_STAGE }}
  LT_HUB_URL_STAGE: ${{ secrets.LT_HUB_URL_STAGE }}

jobs:
  test:
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-ltqa' }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        echo "Installing dependencies..."
        npm install --no-package-lock
        npm install file:packages/appium-navigation-tracker-1.0.0.tgz --no-package-lock
        echo "\nVerifying installations:"
        ls -la node_modules/wd || true
        ls -la node_modules/appium-navigation-tracker || true
    
    - name: Configure LambdaTest credentials
      run: |
        echo "LT_USERNAME_STAGE=${{ secrets.LT_USERNAME_STAGE }}" >> $GITHUB_ENV
        echo "LT_ACCESS_KEY_STAGE=${{ secrets.LT_ACCESS_KEY_STAGE }}" >> $GITHUB_ENV
        echo "LT_APP_ID_STAGE=${{ secrets.LT_APP_ID_STAGE }}" >> $GITHUB_ENV
        echo "LT_HUB_URL_STAGE=${{ secrets.LT_HUB_URL_STAGE }}" >> $GITHUB_ENV
    
    - name: Run GI Test
      id: test
      run: |
        echo "Running GI test..."
        node test/gi-test.js 2>&1 | tee gi-test.log
      continue-on-error: true
    
    - name: Debug - Show test logs
      if: failure()
      run: |
        echo "GI test log:"
        cat gi-test.log || true
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results/
        if-no-files-found: warn 